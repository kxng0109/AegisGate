apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aegisgate
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy-default-deny.yaml
  - networkpolicy-allow.yaml
# Secrets (aegisgate-secrets: postgres-url/user/password) are operator-supplied
# and intentionally absent here — never commit secret values.
