# Default-deny both directions for the app namespace. Trust boundary is
# Redis + PG (TLS + AUTH + ACL), not the pod network: pods never call pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: aegisgate
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
