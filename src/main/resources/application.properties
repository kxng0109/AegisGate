spring.application.name=AegisGate
spring.threads.virtual.enabled=true
gateway.name=lmstudio
gateway.base-url=https://api.openai.com/v1
gateway.api-key.value=${GATEWAY_API_KEY}
gateway.connect-timeout=60s
gateway.request-timeout=60s
gateway.chat-completions-path=/v1/chat/completions

# --- Phase 2: distributed rate limiting & virtual API keys ---
# Redis (Lettuce) connection used by the rate-limit engine and the key store.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=${REDIS_POOL_MAX_ACTIVE:20}
spring.data.redis.lettuce.pool.max-idle=10
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=2s

# Bootstrap keys are provisioned EXCLUSIVELY via environment variables (never
# committed here). Example for the first key:
#   GATEWAY_BOOTSTRAPKEYS_0_OWNERID=owner-1
#   GATEWAY_BOOTSTRAPKEYS_0_NAME=local-dev
#   GATEWAY_BOOTSTRAPKEYS_0_PLAINTEXTKEY=gw-...
#   GATEWAY_BOOTSTRAPKEYS_0_RPMLIMIT=60
#   GATEWAY_BOOTSTRAPKEYS_0_TPMLIMIT=100000
#   GATEWAY_BOOTSTRAPKEYS_0_ALLOWEDMODELS=
#   GATEWAY_BOOTSTRAPKEYS_0_ALLOWEDPROVIDERS=
# Seeding runs after the application is ready and retries until Redis is up.
gateway.bootstrap-keys.seed-interval=30s