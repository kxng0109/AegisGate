name: aegisgate

services:
  # ---------------------------------------------------------------------------
  # Redis 7 with RediSearch - Rate Limiting, Circuit Breakers & Vector Search
  # ---------------------------------------------------------------------------
  redis:
    image: redis/redis-stack-server:latest
    container_name: aegisgate-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    environment:
      REDIS_ARGS: "--appendonly yes --save 60 1 --maxmemory 256mb --maxmemory-policy noeviction --protected-mode no"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    volumes:
      - redis_data:/data
    profiles:
      - deps
      - monitoring
      - all
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    networks:
      - aegisgate-network

  # ---------------------------------------------------------------------------
  # PostgreSQL 16 - Usage & Cost Ledger and Model Pricing Catalog
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: aegisgate-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aegisgate}
      POSTGRES_USER: ${POSTGRES_USER:-aegisgate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegisgate_secret}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-aegisgate} -d $${POSTGRES_DB:-aegisgate}" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    profiles:
      - deps
      - monitoring
      - all
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    networks:
      - aegisgate-network

  # ---------------------------------------------------------------------------
  # AegisGate - Reverse Proxy, Token Bucket Rate Limiter, Resilient Router
  # ---------------------------------------------------------------------------
  aegisgate:
    build:
      context: .
      dockerfile: Dockerfile
    image: aegisgate:latest
    container_name: aegisgate-app
    restart: unless-stopped
    # File descriptors must cover concurrent streams + Redis/PG/upstream sockets.
    # Plain integers: Compose schema-types ulimits as integers, so ${}-interpolated
    # strings fail validation at deploy. Tune by editing these two numbers.
    ulimits:
      nofile:
        soft: 65536
        hard: 100000
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    environment:
      # Spring profile: default serves light/moderate load; set to
      # "high-throughput" to unlock the 100K rps / 50K-stream ceilings
      # (requires tuned Redis/Postgres/kernel/JVM per docs/high-throughput/).
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      # Infrastructure Connections (matching docker network services)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_POOL_MAX_ACTIVE: ${REDIS_POOL_MAX_ACTIVE:-20}
      REDIS_POOL_MAX_IDLE: ${REDIS_POOL_MAX_IDLE:-10}
      REDIS_POOL_MIN_IDLE: ${REDIS_POOL_MIN_IDLE:-2}
      POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-aegisgate}
      POSTGRES_USER: ${POSTGRES_USER:-aegisgate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegisgate_secret}
      HIKARI_MAXIMUM_POOL_SIZE: ${HIKARI_MAXIMUM_POOL_SIZE:-10}
      HIKARI_MINIMUM_IDLE: ${HIKARI_MINIMUM_IDLE:-10}

      # Upstream Provider Keys
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      # Local Ollama (host gateway). Containers cannot reach the host's
      # localhost:11434 directly; set OLLAMA_BASE_URL=http://host.docker.internal:11434
      # in your local .env (Ollama needs no network-access toggle; it listens on 11434).
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}

      # SSRF allowlist for local development backends (exact host; see SsrfUpstreamUrlValidator).
      # Empty by default = every private target fails closed; add host.docker.internal and/or
      # localhost for local Ollama development.
      GATEWAY_DEV_ALLOW_PRIVATE_HOSTS: ${GATEWAY_DEV_ALLOW_PRIVATE_HOSTS:-}

      # Master Admin Key (for /v1/admin/** APIs)
      GATEWAY_ADMIN_MASTERKEY: ${GATEWAY_ADMIN_MASTERKEY:-aegisgate_admin_secret_key}

      # HITL AEAD secret (REQUIRED — the app refuses to start without 32+ bytes).
      # Generate with: openssl rand -base64 32
      GATEWAY_MCP_HITL_SECRET: ${GATEWAY_MCP_HITL_SECRET:-}

      # Capacity ceilings (defaults serve light/moderate load; raise with the
      # high-throughput profile — see docs/high-throughput/README.md)
      AEGIS_SSE_CAPACITY_MAX_CONNECTIONS: ${AEGIS_SSE_CAPACITY_MAX_CONNECTIONS:-10000}
      GATEWAY_LEDGER_EXECUTOR_CORE_POOL_SIZE: ${GATEWAY_LEDGER_EXECUTOR_CORE_POOL_SIZE:-2}
      GATEWAY_LEDGER_EXECUTOR_MAX_POOL_SIZE: ${GATEWAY_LEDGER_EXECUTOR_MAX_POOL_SIZE:-4}
      GATEWAY_LEDGER_EXECUTOR_QUEUE_CAPACITY: ${GATEWAY_LEDGER_EXECUTOR_QUEUE_CAPACITY:-1000}
      GATEWAY_RATELIMIT_KEY_CACHE_MAXIMUM_SIZE: ${GATEWAY_RATELIMIT_KEY_CACHE_MAXIMUM_SIZE:-1000}
      GATEWAY_RATELIMIT_WINDOW_MILLIS: ${GATEWAY_RATELIMIT_WINDOW_MILLIS:-60000}

      # Semantic (L2) cache embedding alias. Resolved via gateway.providers/aliases
      # like any other request; default local-embed works on the local Ollama stack.
      # Set to text-embedding-3-small (or any alias) for a different model.
      GATEWAY_CACHE_SEMANTIC_EMBEDDING_MODEL: ${GATEWAY_CACHE_SEMANTIC_EMBEDDING_MODEL:-local-embed}
      TOMCAT_MAX_CONNECTIONS: ${TOMCAT_MAX_CONNECTIONS:-}
      TOMCAT_ACCEPT_COUNT: ${TOMCAT_ACCEPT_COUNT:-}

      # Virtual Bootstrap Key for local testing
      GATEWAY_BOOTSTRAPKEYS_0_OWNERID: ${GATEWAY_BOOTSTRAPKEYS_0_OWNERID:-local}
      GATEWAY_BOOTSTRAPKEYS_0_NAME: ${GATEWAY_BOOTSTRAPKEYS_0_NAME:-local-dev}
      GATEWAY_BOOTSTRAPKEYS_0_PLAINTEXTKEY: ${GATEWAY_BOOTSTRAPKEYS_0_PLAINTEXTKEY:-gw-localdevmasterkey0123456789abcde}
      GATEWAY_BOOTSTRAPKEYS_0_RPMLIMIT: ${GATEWAY_BOOTSTRAPKEYS_0_RPMLIMIT:-120}
      GATEWAY_BOOTSTRAPKEYS_0_TPMLIMIT: ${GATEWAY_BOOTSTRAPKEYS_0_TPMLIMIT:-500000}
      GATEWAY_BOOTSTRAPKEYS_0_ALLOWEDMODELS: ${GATEWAY_BOOTSTRAPKEYS_0_ALLOWEDMODELS:-}
      GATEWAY_BOOTSTRAPKEYS_0_ALLOWEDPROVIDERS: ${GATEWAY_BOOTSTRAPKEYS_0_ALLOWEDPROVIDERS:-}

      # Load-Test Bootstrap Key (60000 RPM covers the 500 rps flood with headroom).
      # Kept separate from the 120 RPM dev key so rate-integrity stays observable.
      # Point k6 at it: $env:LOAD_KEY = "gw-0123456789abcdef0123456789abcdef"
      GATEWAY_BOOTSTRAPKEYS_1_OWNERID: ${GATEWAY_BOOTSTRAPKEYS_1_OWNERID:-load}
      GATEWAY_BOOTSTRAPKEYS_1_NAME: ${GATEWAY_BOOTSTRAPKEYS_1_NAME:-load-test}
      GATEWAY_BOOTSTRAPKEYS_1_PLAINTEXTKEY: ${GATEWAY_BOOTSTRAPKEYS_1_PLAINTEXTKEY:-gw-0123456789abcdef0123456789abcdef}
      GATEWAY_BOOTSTRAPKEYS_1_RPMLIMIT: ${GATEWAY_BOOTSTRAPKEYS_1_RPMLIMIT:-60000}
      GATEWAY_BOOTSTRAPKEYS_1_TPMLIMIT: ${GATEWAY_BOOTSTRAPKEYS_1_TPMLIMIT:-10000000}

      # Pricing & Ledger Settings
      GATEWAY_PRICING_URL: ${GATEWAY_PRICING_URL:-https://raw.githubusercontent.com/BerriAI/litellm/main/model_prices_and_context_window.json}
      GATEWAY_PRICING_REFRESH_CRON: ${GATEWAY_PRICING_REFRESH_CRON:-0 0 3 * * *}
      GATEWAY_LEDGER_DEAD_LETTER_PATH: ${GATEWAY_LEDGER_DEAD_LETTER_PATH:-logs/ledger-deadletter.log}
      GATEWAY_DATABASE_MIGRATE_ENABLED: "true"
      GATEWAY_DATABASE_MIGRATE_INTERVAL: 30s
    profiles:
      - app
      - monitoring
      - all
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M
        reservations:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    networks:
      - aegisgate-network

  # ---------------------------------------------------------------------------
  # Prometheus 3 - Metrics Aggregator & Alerting Engine
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: aegisgate-prometheus
    restart: unless-stopped
    user: "65534:65534"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.retention.size=20GB"
      - "--storage.tsdb.wal-compression"
      - "--web.enable-lifecycle"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/healthy" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    profiles:
      - monitoring
      - all
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - aegisgate-network

  # ---------------------------------------------------------------------------
  # Grafana 11 - Operational Dashboards & Real-Time Visualization
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana-enterprise:11.5.2
    container_name: aegisgate-grafana
    restart: unless-stopped
    user: "472:0"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-aegisgate_secret}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_AUTH_ANONYMOUS_ENABLED:-true}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    profiles:
      - monitoring
      - all
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - aegisgate-network

volumes:
  postgres_data:
    name: aegisgate_postgres_data
  redis_data:
    name: aegisgate_redis_data
  prometheus_data:
    name: aegisgate_prometheus_data
  grafana_data:
    name: aegisgate_grafana_data

networks:
  aegisgate-network:
    name: aegisgate_network
    driver: bridge
