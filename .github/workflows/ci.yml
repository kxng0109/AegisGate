name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:

  lint-workflows:
    name: Lint workflow files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install actionlint (attestation-verified)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo rhysd/actionlint v1.7.12 \
            --pattern '*_linux_amd64.tar.gz' --dir /tmp/actionlint
          gh attestation verify -R rhysd/actionlint \
            /tmp/actionlint/actionlint_1.7.12_linux_amd64.tar.gz
          tar xf /tmp/actionlint/actionlint_1.7.12_linux_amd64.tar.gz \
            -C /tmp/actionlint
          chmod +x /tmp/actionlint/actionlint

      - name: Lint workflow files
        run: /tmp/actionlint/actionlint -color

      - name: Verify pinned action SHAs resolve
        # actionlint cannot validate SHA existence (its PopularActions map is
        # tag-based), so this sweep fails the build on dead pins like the
        # previously unresolvable codecov SHA.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          fail=0
          while IFS= read -r spec; do
            repo="${spec%@*}"
            sha="${spec#*@}"
            if resolved="$(gh api "repos/${repo}/commits/${sha}" --jq .sha 2>/dev/null)"; then
              if [ "${resolved}" = "${sha}" ]; then
                echo "OK ${spec}"
              else
                echo "::error::SHA mismatch for ${spec} (resolved ${resolved})"
                fail=1
              fi
            else
              echo "::error::Unresolvable action pin ${spec}"
              fail=1
            fi
          done < <(grep -rhoE '[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+@[0-9a-f]{40}' .github/workflows/ | sort -u)
          exit "${fail}"

  commitlint:
    name: Validate commit messages
    # Non-advisory quality gate: bad commit messages fail the build. The
    # previous wagoid/commitlint-github-action@v6 was abandoned (last code
    # change 2025-01-14) and crashes on tag-push events because it dereferences
    # payload.pull_request.commits_url, which is undefined for tag pushes.
    # Replaced with the official npx commitlint pattern + a committed
    # package-lock.json so `npm ci` is deterministic and network-free at lint
    # time. The all-zeros `before` SHA (first push of a new branch) is
    # guarded so commitlint falls back to --last instead of failing on an
    # invalid range.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install commitlint (lockfile-pinned, deterministic)
        run: npm ci

      - name: Lint commit messages
        run: |
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            npx --no-install commitlint --last --verbose
          else
            npx --no-install commitlint --from ${{ github.event.before }} --to ${{ github.event.after }} --verbose
          fi

  build:
    name: Build, test and verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Make the Maven wrapper executable
        run: chmod +x mvnw

      - name: Compile, test and package with coverage gate
        run: ./mvnw -B -ntp clean verify

      - name: Summarize test results
        if: always()
        run: |
          {
            echo "### Test summary"
            if compgen -G "target/surefire-reports/*.txt" > /dev/null; then
              grep -h -E "Tests run:" target/surefire-reports/*.txt \
                | awk -F'[:,]+' '{t+=$2; f+=$4; e+=$6; s+=$8} \
                   END {printf "Tests run: %d, Failures: %d, Errors: %d, Skipped: %d\n", t, f, e, s}'
            else
              echo "No surefire reports were produced."
            fi
            echo "The JaCoCo execution report is attached as the jacoco-report artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JaCoCo coverage report
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: warn

      - name: Upload application jar
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aegisgate-jar
          path: |
            target/*.jar
            !target/*.jar.original
          if-no-files-found: warn

      - name: Check for a Codecov token
        id: codecov-token
        if: success()
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -n "${CODECOV_TOKEN}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload coverage to Codecov
        if: ${{ steps.codecov-token.outputs.run == 'true' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: target/site/jacoco/jacoco.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Scan dependencies for known vulnerabilities
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "${NVD_API_KEY}" ]; then
            echo "NVD_API_KEY is not configured; skipping the dependency scan."
            exit 0
          fi
          ./mvnw -B -ntp org.owasp:dependency-check-maven:13.0.0:check \
            -DfailBuildOnCVSS=11 \
            -Dformat=HTML,SARIF