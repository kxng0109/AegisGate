# ================================================================================
# AegisGate reference postgresql.conf — ledger primary (PG16, 4c/16GB shared).
# Merge into your postgresql.conf and restart. See docs/high-throughput/README.md
# for budgets, COPY ingestion, partitioning, and the replica story.
# ================================================================================
listen_addresses = '*'
port = 5432
max_connections = 60
shared_buffers = 2GB
effective_cache_size = 9GB
work_mem = 8MB
maintenance_work_mem = 512MB
autovacuum_work_mem = 256MB
wal_buffers = 16MB
wal_level = replica
wal_compression = lz4
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
checkpoint_flush_after = 256kB
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_warning = 60s
# Async ledger only: <=600ms loss window on PG crash, covered by the app
# spillway WAL replay. Pricing/migrations/admin writes stay synchronous.
synchronous_commit = off
wal_writer_delay = 200ms
wal_writer_flush_after = 1MB
fsync = on
full_page_writes = on
random_page_cost = 1.1
seq_page_cost = 1.0
effective_io_concurrency = 200
maintenance_io_concurrency = 10
huge_pages = try
max_wal_senders = 5
max_replication_slots = 4
wal_keep_size = 1GB
max_slot_wal_keep_size = 10GB
wal_sender_timeout = 60s
hot_standby = on
hot_standby_feedback = on
max_standby_streaming_delay = 30s
max_standby_archive_delay = 60s
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 15s
autovacuum_vacuum_threshold = 50
autovacuum_vacuum_scale_factor = 0.05
autovacuum_vacuum_insert_threshold = 10000
autovacuum_vacuum_insert_scale_factor = 0.02
autovacuum_analyze_threshold = 50
autovacuum_analyze_scale_factor = 0.02
autovacuum_freeze_max_age = 200000000
log_checkpoints = on
log_lock_waits = on
track_io_timing = on
shared_preload_libraries = 'pg_stat_statements'
max_worker_processes = 8
max_parallel_workers = 4
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2
idle_in_transaction_session_timeout = 30s
statement_timeout = 0
lock_timeout = 5s
