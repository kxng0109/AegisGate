# ================================================================================
# AegisGate reference redis.conf — high-throughput single instance (4c/16GB).
# Copy the MEMORY/EVICTION/PERSISTENCE/NETWORK sections into your redis.conf.
# See docs/high-throughput/README.md for the full story (budgets, replicas,
# key-design rules). Every value below closes on the shared 16GB box.
# ================================================================================

# ---- memory: 3GB cap leaves ~1GB for backlog + buffers + jemalloc ----
maxmemory 3gb
maxmemory-policy volatile-lru
maxmemory-samples 10
replica-ignore-maxmemory yes

# ---- persistence OFF: cache/rate-windows/HITL are reconstructible ----
# Durability story: PostgreSQL is source of truth (ledger/pricing); API keys
# re-seed from GATEWAY_BOOTSTRAPKEYS_* + admin API; HITL loss fails closed.
# NEVER auto-restart this master (empty restart wipes replicas).
save ""
appendonly no
stop-writes-on-bgsave-error no

# ---- expiry responsiveness for 60s windows + 300s HITL + 24h cache ----
hz 30
dynamic-hz yes
activedefrag no
jemalloc-bg-thread yes

# ---- network threads: max 2 (commands stay single-threaded) ----
io-threads 2

# ---- replication (primary side) ----
repl-diskless-sync yes
repl-diskless-sync-delay 2
repl-backlog-size 64mb
repl-backlog-ttl 600
repl-timeout 30
min-replicas-to-write 0

# ---- clients: gateway multiplexes via Lettuce (~10-30 conns, not 50K) ----
tcp-backlog 1024
timeout 0
tcp-keepalive 60
maxclients 5000
client-output-buffer-limit normal 8mb 2mb 30
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60
maxmemory-clients 5%

# ---- lua / slowlog: 6-command rate script is microseconds; trip runaways ----
lua-time-limit 50
slowlog-log-slower-than 5000
slowlog-max-len 256
