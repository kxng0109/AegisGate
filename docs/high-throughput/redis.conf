# ================================================================================
# AegisGate reference redis.conf — high-throughput two-tier layout (4c/16GB).
# The compose stack runs TWO instances; copy the matching section per tier.
# See docs/high-throughput/README.md for the full story (budgets, replicas,
# key-design rules). Every value below closes on the shared 16GB box.
# ================================================================================

# ================================================================================
# TIER 1 — ACCOUNTING (rate limits, budgets, holds, dedupe, circuit breakers)
# noeviction is a CORRECTNESS property here (an evicted month counter resets
# spend to zero), never a tuning knob. AOF everysec bounds crash loss to ~1s
# without blocking the gate path (fsync runs in the BIO thread).
# ================================================================================
maxmemory 384mb
maxmemory-policy noeviction
maxmemory-samples 10

# ---- persistence: AOF everysec + RDB snapshots (hybrid preamble) ----
# ~420K TPS ceiling, far above the 100K gate/s target. NEVER appendfsync always
# (~15K TPS cap). aof-use-rdb-preamble stays yes (7.0+ default) for fast restarts.
save 60 1
appendonly yes
appendfsync everysec
aof-use-rdb-preamble yes
# fsync is NOT suspended during rewrites: no crash-loss window while rewriting.
no-appendfsync-on-rewrite no
stop-writes-on-bgsave-error no

# ---- expiry responsiveness for 60s windows + 24h holds ----
hz 100
activedefrag no
jemalloc-bg-thread yes

# ---- single-threaded command path; 2vCPU leaves no spare core for io-threads --
io-threads 1

# ---- replication (primary side): refuse writes rather than split-brain ----
repl-diskless-sync yes
repl-diskless-sync-delay 2
repl-backlog-size 64mb
repl-backlog-ttl 600
repl-timeout 30
min-replicas-to-write 0
# Raise to 1 + min-replicas-max-lag 10 when a replica exists (fail-closed writes).

# ---- clients: gateway multiplexes via Lettuce (few conns, not 50K) ----
tcp-backlog 1024
timeout 0
tcp-keepalive 60
maxclients 5000
# Gate replies are a few integers: a stalled client must never balloon memory
# (buffers count against maxmemory and could trigger OOM under noeviction).
client-output-buffer-limit normal 32mb 16mb 60
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60
maxmemory-clients 5%

# ---- lua / slowlog: gate scripts are microseconds; trip runaways ----
lua-time-limit 50
slowlog-log-slower-than 5000
slowlog-max-len 256

# ================================================================================
# TIER 2 — CACHE (L1 exact, L2 vectors, replay hot): allkeys-lru so pressure
# evicts only cache keys. A full tier degrades to misses, never to accounting
# corruption. Every cache key MUST carry a TTL; loss is recoverable by design.
# ================================================================================
# maxmemory 512mb
# maxmemory-policy allkeys-lru
# maxmemory-samples 10
# save 60 1
# appendonly yes
# appendfsync everysec
# hz 100
# activedefrag no
# io-threads 1
# client-output-buffer-limit normal 32mb 16mb 60
# maxmemory-clients 5%
