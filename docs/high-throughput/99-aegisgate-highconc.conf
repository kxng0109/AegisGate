# ================================================================================
# AegisGate sysctl + limits for 50K concurrent connections (4c/16GB/1Gbps).
# Copy to /etc/sysctl.d/99-aegisgate-highconc.conf, then `sysctl --system`.
# systemd services IGNORE limits.conf: set LimitNOFILE in the unit instead.
# ================================================================================
net.core.somaxconn = 8192
net.ipv4.tcp_max_syn_backlog = 8192
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_abort_on_overflow = 0
net.core.netdev_max_backlog = 8192
net.core.netdev_budget = 300
net.core.netdev_budget_usecs = 2000
net.ipv4.tcp_timestamps = 1
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 30
net.ipv4.tcp_max_tw_buckets = 65536
net.ipv4.tcp_sack = 1
net.ipv4.tcp_window_scaling = 1
net.ipv4.tcp_keepalive_time = 600
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 6
net.core.rmem_max = 4194304
net.core.wmem_max = 4194304
net.core.optmem_max = 65536
net.ipv4.tcp_rmem = 4096 131072 4194304
net.ipv4.tcp_wmem = 4096 65536 4194304
net.ipv4.tcp_mem = 786432 1179648 1572864
fs.file-max = 1000000
net.ipv4.ip_local_port_range = 1024 65535
# --- only if stateful firewall/NAT runs on this host (prefer NOTRACK bypass) ---
# net.netfilter.nf_conntrack_max = 262144
