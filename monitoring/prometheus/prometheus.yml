global:
  scrape_interval: 5s
  scrape_timeout: 3s
  evaluation_interval: 10s

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  - job_name: "aegisgate"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 5s
    scrape_timeout: 3s
    static_configs:
      - targets: [ "aegisgate:8080" ]
        labels:
          application: "AegisGate"
          environment: "production"

  - job_name: "prometheus"
    scrape_interval: 15s
    static_configs:
      - targets: [ "localhost:9090" ]
