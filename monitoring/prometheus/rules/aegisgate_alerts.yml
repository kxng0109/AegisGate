groups:
  - name: aegisgate-alerts
    rules:
      # -----------------------------------------------------------------------
      # 1. Circuit Breaker State (Tripped Open)
      # -----------------------------------------------------------------------
      - alert: UpstreamCircuitBreakerOpen
        expr: aegis_circuit_breaker_state == 1
        for: 15s
        labels:
          severity: critical
          team: platform-core
        annotations:
          summary: "Circuit breaker OPEN for provider {{ $labels.provider }}"
          description: "Provider {{ $labels.provider }} circuit breaker is OPEN due to consecutive upstream failures or timeouts. Gateway is failing over."

      # -----------------------------------------------------------------------
      # 2. SSE Flush Lag Spike (Streaming Delay)
      # -----------------------------------------------------------------------
      - alert: SseFlushLagSpike
        expr: sse_flush_lag_max_ms > 250
        for: 30s
        labels:
          severity: warning
          team: platform-core
        annotations:
          summary: "High SSE flush latency: {{ $value }}ms"
          description: "Maximum observed SSE flush lag is {{ $value }}ms (threshold: 250ms). Clients may experience token delivery latency."

      # -----------------------------------------------------------------------
      # 3. Downstream Client Backpressure Aborts
      # -----------------------------------------------------------------------
      - alert: HighSseBackpressureAborts
        expr: sum(rate(sse_flush_backpressure_count_total[1m])) > 1.0
        for: 1m
        labels:
          severity: warning
          team: platform-core
        annotations:
          summary: "Elevated SSE backpressure stream terminations"
          description: "Downstream clients are experiencing slow read buffers at {{ $value | humanize }} aborts/sec."

      # -----------------------------------------------------------------------
      # 4. SSE Line Guard Violations / Rejections
      # -----------------------------------------------------------------------
      - alert: SseLineGuardRejectionSpike
        expr: sum by (reason, provider) (rate(sse_line_rejected_count_total[1m])) > 0.5
        for: 30s
        labels:
          severity: warning
          team: security-ops
        annotations:
          summary: "SSE line guard rejections on {{ $labels.provider }} ({{ $labels.reason }})"
          description: "Upstream stream from {{ $labels.provider }} was guarded and truncated due to {{ $labels.reason }} limit."

      # -----------------------------------------------------------------------
      # 5. Database Connection Pool (HikariCP) Near Exhaustion
      # -----------------------------------------------------------------------
      - alert: HikariPoolNearExhaustion
        expr: (hikaricp_connections_active / hikaricp_connections_max) > 0.85
        for: 1m
        labels:
          severity: critical
          team: data-infra
        annotations:
          summary: "HikariCP database pool utilization > 85%"
          description: "Database connection pool is nearly saturated on {{ $labels.instance }}."

      - alert: HikariPoolThreadsPending
        expr: hikaricp_connections_pending > 0
        for: 15s
        labels:
          severity: critical
          team: data-infra
        annotations:
          summary: "Threads blocked waiting for database connection"
          description: "{{ $value }} threads are waiting for a database connection to write to usage ledger."

      # -----------------------------------------------------------------------
      # 6. Ledger Dead Letter Failures
      # -----------------------------------------------------------------------
      - alert: LedgerDeadLetterWrite
        expr: sum(rate(aegis_ledger_dead_letter_total[1m])) > 0
        for: 10s
        labels:
          severity: critical
          team: billing-ops
        annotations:
          summary: "Usage ledger records spilling to dead-letter log"
          description: "Database writes for token accounting failed and are writing to dead-letter file."

      # -----------------------------------------------------------------------
      # 7. Redis Exporter & Memory Pressure
      # -----------------------------------------------------------------------
      - alert: RedisExporterDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
          team: data-infra
        annotations:
          summary: "Redis exporter scrape failing"
          description: "Prometheus cannot scrape redis-exporter:9121. Redis internals are blind."

      - alert: RedisMemoryPressure
        # 85% of the 512M container cap (no maxmemory set, so ratio metrics are absent).
        expr: redis_memory_used_bytes > 436207616
        for: 2m
        labels:
          severity: warning
          team: data-infra
        annotations:
          summary: "Redis memory above 85% of container cap"
          description: "Redis holds {{ $value | humanize1024 }}B. Evictions under noeviction fail writes."

      - alert: RedisMainThreadSaturation
        expr: sum(rate(redis_cpu_user_main_thread_seconds_total[2m])) + sum(rate(redis_cpu_sys_main_thread_seconds_total[2m])) > 0.9
        for: 5m
        labels:
          severity: warning
          team: data-infra
        annotations:
          summary: "Redis main thread above 90% of one CPU"
          description: "Single-threaded command execution is the bottleneck; per-request Lua/KNN volume is too high."

      - alert: RedisEvictionsActive
        expr: increase(redis_evicted_keys_total[1h]) > 0
        for: 5m
        labels:
          severity: critical
          team: data-infra
        annotations:
          summary: "Redis is evicting keys"
          description: "Evictions on a noeviction policy mean writes are failing. Add memory or reduce key churn."

      # -----------------------------------------------------------------------
      # 8. Postgres Exporter, Connections, Deadlocks, Vacuum, Hit Ratio
      # -----------------------------------------------------------------------
      - alert: PostgresExporterDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
          team: data-infra
        annotations:
          summary: "Postgres exporter scrape failing"
          description: "Prometheus cannot scrape postgres-exporter:9187. Postgres internals are blind."

      - alert: PostgresConnectionsHigh
        expr: sum(pg_stat_database_numbackends) / pg_settings_max_connections > 0.8
        for: 2m
        labels:
          severity: warning
          team: data-infra
        annotations:
          summary: "Postgres connections above 80% of max"
          description: "Connection pressure vs Hikari pool (10). Scale pool or investigate idle-in-transaction."

      - alert: PostgresDeadlocks
        expr: increase(pg_stat_database_deadlocks[1h]) > 0
        for: 1m
        labels:
          severity: critical
          team: data-infra
        annotations:
          summary: "Postgres deadlocks detected"
          description: "Deadlocks in the last hour on {{ $labels.datname }}. Inspect concurrent ledger writes."

      - alert: PostgresBufferHitLow
        expr: sum(pg_stat_database_blks_hit) / (sum(pg_stat_database_blks_hit) + sum(pg_stat_database_blks_read)) < 0.99
        for: 15m
        labels:
          severity: warning
          team: data-infra
        annotations:
          summary: "Postgres buffer hit ratio below 99%"
          description: "Working set no longer fits shared buffers; disk reads are climbing."

      - alert: PostgresVacuumStale
        expr: (time() - pg_stat_user_tables_last_autovacuum > 86400) and (pg_stat_user_tables_last_autovacuum > 0)
        for: 1h
        labels:
          severity: warning
          team: data-infra
        annotations:
          summary: "Table {{ $labels.relname }} not autovacuumed in 24h"
          description: "Dead-tuple bloat is growing; check autovacuum workers on a write-heavy ledger."

      # -----------------------------------------------------------------------
      # 9. JVM GC Pause, Error Logs, Rate-Limit Denies, Ledger Backlog
      # -----------------------------------------------------------------------
      - alert: GcPauseHigh
        expr: histogram_quantile(0.99, sum by(le)(rate(jvm_gc_pause_seconds_bucket[5m]))) > 0.2
        for: 2m
        labels:
          severity: warning
          team: platform-core
        annotations:
          summary: "JVM GC p99 pause above 200ms"
          description: "ZGC pause tail is growing; correlate with heap % and allocation rate."

      - alert: LogbackErrors
        expr: sum(rate(logback_events_total{level="error"}[5m])) > 0
        for: 1m
        labels:
          severity: warning
          team: platform-core
        annotations:
          summary: "Application ERROR logs observed"
          description: "Error-level log events at {{ $value | humanize }}/s. Triage via logs before it cascades."

      - alert: RateLimitDenySpike
        expr: (sum(rate(aegis_ratelimit_evaluations_total{decision="denied"}[5m])) / sum(rate(aegis_ratelimit_evaluations_total[5m]))) * 100 > 5
        for: 2m
        labels:
          severity: warning
          team: security-ops
        annotations:
          summary: "Rate-limit deny rate above 5%"
          description: "Clients are being throttled at {{ $value }}%. Verify legitimate burst vs abuse."

      - alert: LedgerQueueGrowing
        expr: aegis_ledger_queue_depth > 50000
        for: 2m
        labels:
          severity: critical
          team: billing-ops
        annotations:
          summary: "Ledger ring buffer above 50K pending"
          description: "Micro-batch writer is behind; spillway journal growth and insert latency likely."
