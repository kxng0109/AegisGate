apiVersion: 1

providers:
  - name: 'AegisGate Dashboards'
    orgId: 1
    folder: 'AegisGate AI Gateway'
    folderUid: 'aegisgate-folder'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
